# ~/.config/hypr/hyprsunset.conf

# Define the maximum gamma (brightness boost) allowed, 150 = 150%
max-gamma = 150

# --- Day Profile (Morning Activation) ---
profile {
    # Time the profile activates (e.g., 6:00 AM)
    time = 6:00
    # identity = true disables the temperature change (normal colors)
    identity = true
    # Normal gamma (1.0 = 100%)
    gamma = 1.0
}

# --- Sunset/Night Profile (Evening Activation) ---
profile {
    # Time the profile activates (e.g., 6:00 PM)
    time = 18:00
    # Sets a warmer color temperature (e.g., 5500K)
    temperature = 5500
    # Slightly dimmer brightness
    gamma = 0.9
}

# --- Deep Night Profile (Optional: for later/dimmer settings) ---
profile {
    # Time the profile activates (e.g., 10:00 PM)
    time = 22:00
    # Sets a much warmer temperature (e.g., 3000K)
    temperature = 4000
    # Dims the screen more
    gamma = 0.8
}
