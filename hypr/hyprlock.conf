# ----------------------------------------------------------------------
# HYPRLOCK CONFIGURATION FILE with Transparency & Fixes
# ----------------------------------------------------------------------

# ==================================
# 1. ANIMATION FIX
# ==================================
animations {
    # DISABLE FADE-IN to prevent the black flash
    animation = fade, 0, 1, default
    
    # Render immediately (highly recommended for stability)
    immediate_render = true 
}

# ==================================
# 2. BACKGROUND LAYER (FULLY TRANSPARENT)
# ==================================
background {
    monitor = 
    
    # DIMMED TRANSPARENCY: rgba(R, G, B, A)
    # R=0, G=0, B=0 (Black color)
    # A=0.3 (30% opaque, 70% transparent)
    color = rgba(0, 0, 0, 0.3)

    path = ~/Pictures/Wallpapers/b-688.jpg
    
    # You can also use the hex format with 8 digits: 0x0000004D
    # (0x000000 is black, 4D is the hex equivalent of ~30% alpha)
    # color = 0x0000004D
    
    blur_passes = 0
    noise = 0.0
}

# ==================================
# 3. CLOCK LABEL
# ==================================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')" 
    position = 0, 450
    halign = center
    valign = center
    font_size = 72
    font_family = sans-serif
    color = rgb(f49448)
}

# ==================================
# 4. PASSWORD INPUT FIELD
# ==================================
input-field {
    monitor =
    size = 200, 40
    position = 0, 0
    halign = center
    valign = center
    placeholder_text = <i>Enter Password</i>
    font_family = sans-serif
    font_size = 20
    
    # Translucent inner background (70% opaque)
    inner_color = rgba(282828, 0.7) 
    outer_color = rgba(1a1a1a, 0) # Transparent border
    font_color = rgb(333333) 
    
    dots_size = 0.33 
    dots_spacing = 0.15
    rounding = -1
    
    fail_color = rgb(f38ba8)
    check_color = rgb(a6e3a1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
}
