# file path: ~/.config/hypr/conf/env.conf

# XCursor / XWayland Variable (Used by most XWayland apps)
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24  # Choose your desired size (24, 32, or 48 are common)

# Hyprland Native Command (Ensures the Hyprland cursor itself is set)
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# GTK/GNOME Settings (CRITICAL for VS Code and other GTK/Electron apps)
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
