general {
    # Optional: Command to run when receiving a DBus lock event (e.g., loginctl lock-session)
    # This ensures only one hyprlock instance runs and the session is properly locked.
    lock_cmd = pidof hyprlock || hyprlock
    
    # Optional: Command to run before the system suspends (e.g., when closing the laptop lid)
    before_sleep_cmd = loginctl lock-session
}

# Listener to lock the screen after 5 minutes (300 seconds) of inactivity
listener {
    timeout = 300 # 5 minutes in seconds
    on-timeout = loginctl lock-session # This will execute the general:lock_cmd (hyprlock)
    on-resume = # Optional command to run when activity is detected (e.g., notify-send "Welcome back!")
}

# Optional: Listener to turn off the screen a little later
listener {
    timeout = 420 # 7 minutes (120 seconds after lock)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
